<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Agent Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b6cff'/%3E%3Ccircle cx='11' cy='14' r='4' fill='%23fff'/%3E%3Ccircle cx='21' cy='14' r='4' fill='%23fff' opacity='.7'/%3E%3Crect x='8' y='21' width='16' height='3' rx='1.5' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="side" id="side">
      <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i></span>Agent Hub</div>
      <div class="engine" id="engine" role="status"></div>

      <section class="side-group">
        <div class="side-head"><h2>Rooms</h2><a class="add" href="#new-room" aria-label="New room">+ New</a></div>
        <nav class="side-list" id="room-list"></nav>
      </section>

      <section class="side-group">
        <div class="side-head"><h2>Agents</h2><a class="add" href="#new-agent" aria-label="New agent">+ New</a></div>
        <nav class="side-list" id="agent-list"></nav>
      </section>
    </aside>

    <main class="main" id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
