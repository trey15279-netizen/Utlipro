# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: command-hub
    runtime: node
    plan: starter # a persistent disk needs a paid plan; free plans wipe the database on every deploy
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/commandhub.db
      - key: APP_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: META_PIXEL_ID
        sync: false
      - key: GOOGLE_TAG_ID
        sync: false
      - key: GOOGLE_ADS_SIGNUP_CONVERSION
        sync: false
